# Render Blueprint for the RuneCodex API.
# Secrets (DATABASE_URL, JWT_SECRET, CORS_ORIGINS) must be set in the dashboard.
# Do not put real credentials in this file.

services:
  - type: web
    name: runescodex-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: DATABASE_URL
        sync: false
      - key: PRODUCTION_DATABASE_HOST
        sync: false
      - key: STAGING_DATABASE_HOST
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADO_PAGO_NOTIFICATION_URL
        sync: false
      - key: MERCADO_PAGO_BACK_URL_SUCCESS
        sync: false
      - key: MERCADO_PAGO_BACK_URL_PENDING
        sync: false
      - key: MERCADO_PAGO_BACK_URL_FAILURE
        sync: false
      - key: REVENUECAT_SECRET_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_AUTHORIZATION
        sync: false

  # Static Vite app. The API service above is unchanged.
  # Files are published under /runescodex/ so Vercel can proxy that path
  # without replacing https://tritech.app.br/.
  - type: web
    name: runescodex-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build:render
    staticPublishPath: ./render-publish
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: https://runescodex-api.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /runescodex
        destination: /runescodex/index.html
      - type: rewrite
        source: /runescodex/*
        destination: /runescodex/index.html
    headers:
      - path: /runescodex/sw.js
        name: Cache-Control
        value: no-cache
      - path: /runescodex/index.html
        name: Cache-Control
        value: no-cache
