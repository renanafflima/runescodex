version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: runescodex-postgres
    restart: always
    environment:
      POSTGRES_USER: runescodex
      POSTGRES_PASSWORD: runescodex_dev
      POSTGRES_DB: runescodex_dev
    ports:
      - "5432:5432"
    volumes:
      - runescodex_dev_data:/var/lib/postgresql/data

volumes:
  runescodex_dev_data:
