<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RuneCodex · Rewards Admin</title>
  <style>
    :root {
      --bg: #0f141c;
      --panel: #171e29;
      --line: #2a3545;
      --text: #e8eef6;
      --muted: #93a0b3;
      --gold: #d9ad3f;
      --ok: #3dba7a;
      --warn: #e0a106;
      --bad: #d35c5c;
      --info: #4aa3e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Segoe UI, Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: #121823;
    }
    h1 { font-size: 18px; margin: 0; }
    h1 span { color: var(--gold); }
    main { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, select, textarea, button {
      font: inherit;
      color: var(--text);
    }
    input, select, textarea {
      width: 100%;
      background: #0f151e;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
    }
    button {
      background: #2b3950;
      border: 1px solid #3c4d67;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.primary { background: #3a4f2e; border-color: #567445; }
    button.danger { background: #4a2a2a; border-color: #6d3a3a; }
    .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .filters { display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 10px; align-items: end; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .stat { padding: 12px; border-radius: 8px; background: #121923; border: 1px solid var(--line); }
    .stat b { display: block; font-size: 22px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
    tr { cursor: pointer; }
    tr:hover { background: #1d2633; }
    .status { font-weight: 700; font-size: 12px; }
    .PENDING { color: var(--warn); }
    .APPROVED { color: var(--info); }
    .DELIVERED { color: var(--ok); }
    .CANCELLED { color: var(--bad); }
    .error { color: var(--bad); margin-top: 8px; }
    .hidden { display: none; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .history { font-size: 13px; color: var(--muted); }
    @media (max-width: 900px) {
      .row, .filters, .stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>RuneCodex <span>Rewards Admin</span></h1>
    <div id="session"></div>
  </header>
  <main>
    <section id="login-card" class="card">
      <h2>Entrar</h2>
      <p class="history">Use uma conta com papel ADMIN. Rotas administrativas são validadas no backend.</p>
      <div class="row">
        <div>
          <label>E-mail</label>
          <input id="email" type="email" autocomplete="username" />
        </div>
        <div>
          <label>Senha</label>
          <input id="password" type="password" autocomplete="current-password" />
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="login-btn" type="button">Entrar</button>
      </div>
      <div id="login-error" class="error"></div>
    </section>

    <section id="dash" class="hidden">
      <div class="stats" id="stats"></div>
      <div class="card">
        <div class="filters">
          <div>
            <label>Status</label>
            <select id="filter-status">
              <option value="">Todos</option>
              <option value="PENDING">PENDING</option>
              <option value="APPROVED">APPROVED</option>
              <option value="DELIVERED">DELIVERED</option>
              <option value="CANCELLED">CANCELLED</option>
            </select>
          </div>
          <div>
            <label>Usuário (e-mail ou ID)</label>
            <input id="filter-user" />
          </div>
          <div>
            <label>Reward (nome ou ID)</label>
            <input id="filter-reward" />
          </div>
          <div>
            <label>De</label>
            <input id="filter-from" type="date" />
          </div>
          <div>
            <label>Até</label>
            <input id="filter-to" type="date" />
          </div>
          <button id="apply-filters" type="button">Filtrar</button>
        </div>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Usuário</th>
              <th>Reward</th>
              <th>Moeda</th>
              <th>Preço</th>
              <th>Status</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="card hidden" id="detail"></div>
    </section>
  </main>
  <script>
    const tokenKey = "rc_admin_token";
    const api = (path, options = {}) => {
      const headers = { ...(options.headers || {}) };
      const token = sessionStorage.getItem(tokenKey);
      if (token) headers.Authorization = "Bearer " + token;
      if (options.body && !(options.body instanceof FormData)) {
        headers["Content-Type"] = "application/json";
      }
      return fetch(path, { ...options, headers }).then(async (res) => {
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch { data = text; }
        if (!res.ok) {
          const message = (data && (data.message || data.error)) || res.statusText;
          throw new Error(Array.isArray(message) ? message.join(", ") : message);
        }
        return data;
      });
    };

    const loginCard = document.getElementById("login-card");
    const dash = document.getElementById("dash");
    const session = document.getElementById("session");
    const loginError = document.getElementById("login-error");
    const rows = document.getElementById("rows");
    const stats = document.getElementById("stats");
    const detail = document.getElementById("detail");

    function fmt(date) {
      return date ? new Date(date).toLocaleString("pt-BR") : "—";
    }

    async function boot() {
      const token = sessionStorage.getItem(tokenKey);
      if (!token) return;
      try {
        const me = await api("/auth/me");
        if (me.role !== "ADMIN") {
          sessionStorage.removeItem(tokenKey);
          return;
        }
        showDash(me);
        await loadList();
      } catch {
        sessionStorage.removeItem(tokenKey);
      }
    }

    function showDash(me) {
      loginCard.classList.add("hidden");
      dash.classList.remove("hidden");
      session.innerHTML = me.email + ' · <button id="logout" type="button">Sair</button>';
      document.getElementById("logout").onclick = () => {
        sessionStorage.removeItem(tokenKey);
        location.reload();
      };
    }

    async function loadList() {
      const params = new URLSearchParams();
      const status = document.getElementById("filter-status").value;
      const user = document.getElementById("filter-user").value.trim();
      const reward = document.getElementById("filter-reward").value.trim();
      const from = document.getElementById("filter-from").value;
      const to = document.getElementById("filter-to").value;
      if (status) params.set("status", status);
      if (user) params.set("user", user);
      if (reward) params.set("reward", reward);
      if (from) params.set("from", new Date(from).toISOString());
      if (to) {
        const end = new Date(to);
        end.setHours(23, 59, 59, 999);
        params.set("to", end.toISOString());
      }
      const data = await api("/admin/rewards/redemptions?" + params.toString());
      stats.innerHTML = ["PENDING","APPROVED","DELIVERED","CANCELLED"].map((key) => (
        `<div class="stat"><span>${key}</span><b class="${key}">${data.counts[key] || 0}</b></div>`
      )).join("");
      rows.innerHTML = (data.items || []).map((item) => `
        <tr data-id="${item.id}">
          <td>${item.id.slice(0, 8)}…</td>
          <td>${item.user ? item.user.email : item.userId}</td>
          <td>${item.reward ? item.reward.name : item.catalogItemId}</td>
          <td>${item.currency}</td>
          <td>${item.price}</td>
          <td class="status ${item.status}">${item.status}</td>
          <td>${fmt(item.createdAt)}</td>
        </tr>
      `).join("");
      rows.querySelectorAll("tr").forEach((tr) => {
        tr.onclick = () => openDetail(tr.getAttribute("data-id"));
      });
    }

    async function openDetail(id) {
      const item = await api("/admin/rewards/redemptions/" + id);
      const history = (item.statusHistory || []).map((event) => (
        `<li>${fmt(event.createdAt)} · ${event.fromStatus || "—"} → ${event.toStatus} · ${event.actor && event.actor.email ? event.actor.email : ""} ${event.note ? "· " + event.note : ""}</li>`
      )).join("");
      let actions = "";
      if (item.status === "PENDING") {
        actions = `<button class="primary" data-act="approve">Aprovar</button><button class="danger" data-act="cancel">Cancelar</button>`;
      } else if (item.status === "APPROVED") {
        actions = `<button class="primary" data-act="deliver">Marcar como entregue</button><button class="danger" data-act="cancel">Cancelar</button>`;
      }
      detail.classList.remove("hidden");
      detail.innerHTML = `
        <h3>Resgate ${item.id}</h3>
        <p>Usuário: <b>${item.user ? item.user.email : item.userId}</b></p>
        <p>Reward: <b>${item.reward ? item.reward.name : item.catalogItemId}</b></p>
        <p>Preço congelado: <b>${item.price} ${item.currency}</b> · Qtd: ${item.quantity}</p>
        <p>Pedido: ${fmt(item.createdAt)} · Status: <b class="${item.status}">${item.status}</b></p>
        <p>${item.message || ""}</p>
        <p>Nota admin: ${item.adminNote || "—"}</p>
        <p>Entrega: ${item.deliveryNote || "—"}</p>
        <p>Cancelamento: ${item.cancellationReason || "—"}</p>
        <p>Aprovado por: ${item.approvedBy ? item.approvedBy.email : "—"} em ${fmt(item.approvedAt)}</p>
        <p>Entregue por: ${item.deliveredBy ? item.deliveredBy.email : "—"} em ${fmt(item.deliveredAt)}</p>
        <p>Cancelado por: ${item.cancelledBy ? item.cancelledBy.email : "—"} em ${fmt(item.cancelledAt)}</p>
        <label>Observação</label>
        <textarea id="note" rows="2"></textarea>
        <div class="actions">${actions}</div>
        <h4>Histórico de status</h4>
        <ul class="history">${history || "<li>Sem eventos</li>"}</ul>
      `;
      detail.querySelectorAll("button[data-act]").forEach((btn) => {
        btn.onclick = () => runAction(item.id, btn.getAttribute("data-act"));
      });
    }

    async function runAction(id, act) {
      const note = (document.getElementById("note") || {}).value || "";
      const labels = {
        approve: "Aprovar este resgate?",
        deliver: "Marcar este resgate como entregue?",
        cancel: "Cancelar este resgate e devolver o saldo?",
      };
      if (!confirm(labels[act])) return;
      const path = `/admin/rewards/redemptions/${id}/${act}`;
      const body = act === "approve"
        ? { adminNote: note }
        : act === "deliver"
          ? { deliveryNote: note }
          : { cancellationReason: note };
      try {
        await api(path, { method: "POST", body: JSON.stringify(body) });
        await loadList();
        await openDetail(id);
      } catch (err) {
        alert(err.message);
        await loadList();
      }
    }

    document.getElementById("login-btn").onclick = async () => {
      loginError.textContent = "";
      try {
        const data = await api("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        if (!data.user || data.user.role !== "ADMIN") {
          throw new Error("Esta conta não possui acesso administrativo.");
        }
        sessionStorage.setItem(tokenKey, data.accessToken);
        showDash(data.user);
        await loadList();
      } catch (err) {
        loginError.textContent = err.message;
      }
    };

    document.getElementById("apply-filters").onclick = () => loadList();
    boot();
  </script>
</body>
</html>
