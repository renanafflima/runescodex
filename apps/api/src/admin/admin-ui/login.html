<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RuneCodex · Rewards Admin</title>
  <style>
    :root {
      --bg: #0f141c;
      --panel: #171e29;
      --line: #2a3545;
      --text: #e8eef6;
      --muted: #93a0b3;
      --gold: #d9ad3f;
      --bad: #d35c5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Segoe UI, Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: #121823;
    }
    h1 { font-size: 18px; margin: 0; }
    h1 span { color: var(--gold); }
    main { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, button { font: inherit; color: var(--text); }
    input {
      width: 100%;
      background: #0f151e;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
    }
    button {
      background: #3a4f2e;
      border: 1px solid #567445;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .error { color: var(--bad); margin-top: 8px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .history { font-size: 13px; color: var(--muted); }
    @media (max-width: 900px) {
      .row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>RuneCodex <span>Rewards Admin</span></h1>
  </header>
  <main>
    <section class="card">
      <h2>Entrar</h2>
      <p class="history">Use uma conta com papel ADMIN. Rotas administrativas são validadas no backend.</p>
      <div class="row">
        <div>
          <label>E-mail</label>
          <input id="email" type="email" autocomplete="username" />
        </div>
        <div>
          <label>Senha</label>
          <input id="password" type="password" autocomplete="current-password" />
        </div>
      </div>
      <div class="actions">
        <button id="login-btn" type="button">Entrar</button>
      </div>
      <div id="login-error" class="error"></div>
    </section>
  </main>
  <script>
    const tokenKey = "rc_admin_token";
    const loginError = document.getElementById("login-error");
    document.getElementById("login-btn").onclick = async () => {
      loginError.textContent = "";
      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json().catch(() => null);
        if (!res.ok) {
          const message = data && (data.message || data.error);
          throw new Error(Array.isArray(message) ? message.join(", ") : (message || "Falha no login"));
        }
        if (!data.user || data.user.role !== "ADMIN" || !data.accessToken) {
          throw new Error("Esta conta não possui acesso administrativo.");
        }
        sessionStorage.setItem(tokenKey, data.accessToken);
        const sessionRes = await fetch("/admin/session", {
          method: "POST",
          credentials: "same-origin",
          headers: { Authorization: "Bearer " + data.accessToken },
        });
        if (!sessionRes.ok) {
          throw new Error("Não foi possível abrir a sessão administrativa.");
        }
        location.href = "/admin";
      } catch (err) {
        loginError.textContent = err.message;
      }
    };
  </script>
</body>
</html>
